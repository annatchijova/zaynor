apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prom-lab
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s

  - name: Loki
    type: loki
    uid: loki-lab
    access: proxy
    url: http://loki:3100

  - name: Tempo
    type: tempo
    uid: tempo-lab
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToMetrics:
        datasourceUid: prom-lab
