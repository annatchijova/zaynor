[project]
name = "zaynor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # MCP SDK — client support for VIGÍA/auxiliary bridges and the local
    # ZAYNOR-owned stdio server.
    "mcp>=1.27,<2",
    "trio>=0.30,<1",
]

[project.optional-dependencies]
# `zaynor serve` — the OpenAI-compatible HTTP surface OpenWebUI talks to.
# Optional: `analyze`/`freeze`/`audit`/`chat` do not need an HTTP server.
api = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2"]
# `zaynor report --format pdf`. `md`/`html` need no extra dependency.
report = ["reportlab>=4"]
# OTel spans over freeze/analyze/tool-call steps (src/zaynor/telemetry.py).
# Optional: every command runs identically without it, hash chain untouched.
telemetry = ["opentelemetry-sdk>=1.20,<2"]

[project.scripts]
zaynor = "zaynor.cli:main"
zaynor-mcp = "zaynor.zaynor_mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["zaynor*", "vendor*"]

[tool.setuptools.package-data]
"vendor.vigia_engine" = ["*.py", "*.md", "vigia/**/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
