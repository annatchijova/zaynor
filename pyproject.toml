[project]
name = "zaynor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # MCP client SDK — talks to VIGÍA's bridge (vigia_sift_bridge.py) over
    # stdio. Already used to build src/zaynor/vigia_mcp_client.py; no
    # ZAYNOR-local reimplementation of the MCP protocol was considered a
    # reasonable alternative.
    "mcp>=1.27",
]

[project.optional-dependencies]
# `zaynor serve` — the OpenAI-compatible HTTP surface OpenWebUI talks to.
# Optional: `analyze`/`freeze`/`audit`/`chat` do not need an HTTP server.
api = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2"]

[project.scripts]
zaynor = "zaynor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
