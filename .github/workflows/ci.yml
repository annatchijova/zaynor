name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff + commitlint self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history for the commitlint self-test)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff==0.16.8"
      - name: Ruff check
        run: ruff check src tests scripts conftest.py
      - name: Commitlint self-test (full history must pass the gate)
        run: |
          git log --format=%s | while IFS= read -r subject; do
            printf '%s\n' "$subject" | python3 scripts/commitlint.py
          done

  docs-sync:
    name: docs sync gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout (full history for the merge-base diff)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Docs-sync gate (code changes must update the docs that describe them)
        run: python3 scripts/docs_check.py --base origin/main

  format:
    name: black --check (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install black
        run: pip install "black==26.5.1"
      - name: Black check (informational only - tree predates formatting)
        run: black --check src/zaynor/api.py scripts/commitlint.py || true

  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install package with API + report + telemetry extras
        run: pip install -e ".[api,report,telemetry]"
      - name: Install test dependencies
        run: pip install "pytest==9.1.1" "pytest-asyncio==1.4.0" "pytest-timeout==2.4.0"
      - name: Run tests (vol-binary readiness tests need the real binary)
        run: python3 -m pytest tests/ -q --timeout=60 --deselect tests/test_memory_forensics_readiness.py::test_real_vol_binary_is_installed --deselect tests/test_memory_forensics_readiness.py::test_vol3_alias_makes_vigias_fallback_name_resolve_and_run

  mypy:
    name: mypy (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install package with API extra (for mypy imports)
        run: pip install -e ".[api]"
      - name: Install mypy
        run: pip install "mypy==2.3.1"
      - name: Type check (informational only - advisory baseline, see pyproject tool.mypy)
        run: mypy src/zaynor/ || true

  frontend:
    name: frontend lint + typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
